services:
  postgres:
    image: postgres:16-alpine
    container_name: zelo-postgres
    environment:
      POSTGRES_DB: zelo
      POSTGRES_USER: zelo
      POSTGRES_PASSWORD: zelo
    ports:
      - "5432:5432"
    volumes:
      - zelo_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U zelo -d zelo"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  zelo_pgdata:
